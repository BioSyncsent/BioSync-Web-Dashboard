<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bio-Sync Sentinel</title>
    <style>
      /* Page Loader Style */
      #loader-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #ffffff;
        z-index: 99999;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      
      #loader-wrapper.fade-out {
        opacity: 0;
        visibility: hidden;
      }

      /* From Uiverse.io by terenceodonoghue */ 
      #loader-wrapper .container {
        position: absolute;
        top: 50%;
        left: 50%;
        border-radius: 50%;
        height: 96px;
        width: 96px;
        animation: rotate_3922 1.2s linear infinite;
        background-color: #9b59b6;
        background-image: linear-gradient(#9b59b6, #84cdfa, #5ad1cd);
      }

      #loader-wrapper .container span {
        position: absolute;
        border-radius: 50%;
        height: 100%;
        width: 100%;
        background-color: #9b59b6;
        background-image: linear-gradient(#9b59b6, #84cdfa, #5ad1cd);
      }

      #loader-wrapper .container span:nth-of-type(1) {
        filter: blur(5px);
      }

      #loader-wrapper .container span:nth-of-type(2) {
        filter: blur(10px);
      }

      #loader-wrapper .container span:nth-of-type(3) {
        filter: blur(25px);
      }

      #loader-wrapper .container span:nth-of-type(4) {
        filter: blur(50px);
      }

      #loader-wrapper .container::after {
        content: "";
        position: absolute;
        top: 10px;
        left: 10px;
        right: 10px;
        bottom: 10px;
        background-color: #fff;
        border: solid 5px #ffffff;
        border-radius: 50%;
      }

      @keyframes rotate_3922 {
        from {
          transform: translate(-50%, -50%) rotate(0deg);
        }
        to {
          transform: translate(-50%, -50%) rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <!-- Responsive Page Loader -->
    <div id="loader-wrapper">
      <div class="container">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      (function() {
        const startTime = Date.now();
        window.addEventListener('load', function() {
          const elapsedTime = Date.now() - startTime;
          const remainingTime = Math.max(0, 2000 - elapsedTime);
          
          setTimeout(function() {
            const loader = document.getElementById('loader-wrapper');
            if (loader) {
              loader.classList.add('fade-out');
              setTimeout(function() {
                loader.remove();
              }, 500); // Match transition duration (0.5s)
            }
          }, remainingTime);
        });
      })();
    </script>
  </body>
</html>
