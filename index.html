<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bio-Sync Sentinel</title>
    <style>
      /* Page Loader Style */
      #loader-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #050912;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      
      #loader-wrapper.fade-out {
        opacity: 0;
        visibility: hidden;
      }

      /* From Uiverse.io by risabbir */ 
      .warp-loader {
        position: relative;
        width: 160px;
        height: 160px;
      }

      .ring {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(
          circle,
          rgba(0, 255, 255, 0.15) 30%,
          transparent 70%
        );
        animation: pulse 2.2s ease-out infinite;
        opacity: 0;
        box-shadow:
          0 0 12px #00d1ff66,
          0 0 24px #00d1ff33;
        border: 2px solid rgba(0, 255, 255, 0.2);
      }

      .ring:nth-child(1) {
        animation-delay: 0s;
      }
      .ring:nth-child(2) {
        animation-delay: 0.4s;
      }
      .ring:nth-child(3) {
        animation-delay: 0.8s;
      }
      .ring:nth-child(4) {
        animation-delay: 1.2s;
      }

      @keyframes pulse {
        0% {
          transform: translate(-50%, -50%) scale(0.3);
          opacity: 1;
        }
        70% {
          transform: translate(-50%, -50%) scale(1.1);
          opacity: 0.15;
        }
        100% {
          transform: translate(-50%, -50%) scale(1.4);
          opacity: 0;
        }
      }

      .core-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 24px; /* Reduced size for the core glow */
        height: 24px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle at center, #00e5ff, #0099cc);
        box-shadow:
          0 0 25px #00e5ff,
          0 0 60px #00e5ff88,
          0 0 100px #00e5ff33;
        animation: corePulse 1.6s ease-in-out infinite;
      }

      @keyframes corePulse {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          transform: translate(-50%, -50%) scale(1.2);
        }
      }
    </style>
  </head>
  <body>
    <div id="loader-wrapper">
      <div class="warp-loader">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="core-glow"></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      (function() {
        const startTime = Date.now();
        window.addEventListener('load', function() {
          const elapsedTime = Date.now() - startTime;
          const remainingTime = Math.max(0, 2000 - elapsedTime);
          
          setTimeout(function() {
            const loader = document.getElementById('loader-wrapper');
            if (loader) {
              loader.classList.add('fade-out');
              setTimeout(function() {
                loader.remove();
              }, 500); // Match transition duration (0.5s)
            }
          }, remainingTime);
        });
      })();
    </script>
  </body>
</html>
